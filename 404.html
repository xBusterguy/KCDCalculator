<style>
/* Shared styles for every page */
:root{--bg:#f6f1e7;--card:#fffdf8;--tx:#2a2218;--mut:#7a6c58;--ac:#8a5a1c;--on:#fffdf8;--bd:#dccfb8;--ok:#2f7a3a;--bad:#b03a2e;--bar:#c9a05a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f0b;--card:#1e1913;--tx:#eadfca;--mut:#a39278;--ac:#d9a44f;--on:#120f0b;--bd:#3a3125;--ok:#6fc47c;--bad:#e8786b;--bar:#8a6a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f0b;--card:#1e1913;--tx:#eadfca;--mut:#a39278;--ac:#d9a44f;--on:#120f0b;--bd:#3a3125;--ok:#6fc47c;--bad:#e8786b;--bar:#8a6a2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
main{max-width:1100px;margin:0 auto;padding:0 14px 16px}
h1{font-size:1.4rem;margin:0 0 6px;color:var(--ac)}h2{font-size:1rem;margin:0 0 6px}
h3{font-size:.85rem;margin:10px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p.s{color:var(--mut);margin:0 0 10px;font-size:.88rem}
a{color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:8px}
label.f{display:flex;flex-direction:column;font-size:.75rem;color:var(--mut);gap:2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;max-width:100%;box-sizing:border-box}
input[type=checkbox]{width:auto}button{cursor:pointer}button.pri{background:var(--ac);color:var(--on);border:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px}
details>summary{cursor:pointer;font-weight:bold}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{font-size:.75rem;color:var(--mut)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.w{color:var(--bad)}.p{color:var(--ok)}
/* site navigation + footer */
nav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:1280px;margin:0 auto;padding:10px 14px}
nav.site a{text-decoration:none;color:var(--tx);padding:5px 12px;border-radius:999px;border:1px solid transparent}
nav.site a:hover{border-color:var(--bd)}nav.site a[aria-current=page]{background:var(--ac);color:var(--on)}
nav.site .brand{font-weight:bold;color:var(--ac);padding-left:0}nav.site button{margin-left:auto}
footer.site{max-width:1280px;margin:0 auto;padding:6px 14px 24px;color:var(--mut);font-size:.8rem}
/* home */
.hero{padding:10px 0 4px}.hero p{max-width:60ch;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{display:block;text-decoration:none;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:14px;background:var(--card)}
.tile:hover{border-color:var(--ac)}.tile h2{color:var(--ac);font-size:1.1rem}.tile p{margin:0;color:var(--mut)}
.sig{margin-top:6px}.sig b{color:var(--tx)}.sig svg{width:1.3em;height:1.3em;vertical-align:-.3em;margin:0 .2em 0 .1em;fill:#5865F2}
nav.site a.gh{margin-left:auto;color:var(--mut)}.sig a{color:var(--ac)}
@media print{nav.site,footer.site{display:none}}
/* theme picker */
nav.site select{font-size:.85rem;padding:4px 6px;margin-left:auto}nav.site a.gh+select,nav.site select+button{margin-left:0}nav.site a.gh+select{margin-left:8px}
/* Medieval ledger theme (select "Medieval ledger" in the nav) */
:root[data-skin=ledger]{--bg:#d8c59b;--card:#efe1bb;--tx:#2a1c0e;--mut:#66502f;--ac:#8a1c1c;--on:#f4e8c8;--bd:#8d7147;--ok:#2d5a28;--bad:#8a1c1c;--bar:#a67a3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root[data-skin=ledger]:not([data-theme=light]){--bg:#17110a;--card:#241a0f;--tx:#e8d6a6;--mut:#a68e62;--ac:#d2604a;--on:#17110a;--bd:#5c4526;--ok:#86b66f;--bad:#e0705c;--bar:#8d6a30;color-scheme:dark}}
:root[data-skin=ledger][data-theme=dark]{--bg:#17110a;--card:#241a0f;--tx:#e8d6a6;--mut:#a68e62;--ac:#d2604a;--on:#17110a;--bd:#5c4526;--ok:#86b66f;--bad:#e0705c;--bar:#8d6a30;color-scheme:dark}
html[data-skin=ledger] body{min-height:100vh;font:16px/1.55 "Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style","URW Palladio L",Garamond,Georgia,serif;
 background-image:radial-gradient(ellipse at 50% 30%,rgba(255,244,205,.18),rgba(60,35,10,.22) 100%),repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(110,76,34,.16) 27px,rgba(110,76,34,.16) 28px);background-attachment:fixed,scroll}
html[data-skin=ledger][data-theme=dark] body{background-image:radial-gradient(ellipse at 50% 30%,rgba(255,200,120,.05),rgba(0,0,0,.35) 100%),repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(200,150,80,.07) 27px,rgba(200,150,80,.07) 28px)}
@media (prefers-color-scheme:dark){html[data-skin=ledger]:not([data-theme=light]) body{background-image:radial-gradient(ellipse at 50% 30%,rgba(255,200,120,.05),rgba(0,0,0,.35) 100%),repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(200,150,80,.07) 27px,rgba(200,150,80,.07) 28px)}}
@media (min-width:1240px){html[data-skin=ledger] body{box-shadow:inset 46px 0 0 -44px var(--ac),inset 52px 0 0 -50px var(--ac)}}
html[data-skin=ledger] ::selection{background:var(--ac);color:var(--on)}
html[data-skin=ledger] h1,html[data-skin=ledger] h2,html[data-skin=ledger] h3{font-variant:small-caps;letter-spacing:.06em;color:var(--ac)}
html[data-skin=ledger] h1{font-size:1.9rem;border-bottom:3px double var(--bd);padding-bottom:4px;margin-bottom:10px}
html[data-skin=ledger] h1::first-letter{font-size:1.35em;font-weight:bold}
html[data-skin=ledger] h3{border-bottom:1px solid var(--bd);padding-bottom:2px}
html[data-skin=ledger] p.s{font-style:italic}
html[data-skin=ledger] .card,html[data-skin=ledger] .tile{border:1px solid var(--bd);border-radius:2px;background-image:linear-gradient(rgba(255,250,225,.22),rgba(120,85,40,.07));box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--bd),2px 3px 0 rgba(60,35,10,.18)}
html[data-skin=ledger][data-theme=dark] .card,html[data-skin=ledger][data-theme=dark] .tile{background-image:linear-gradient(rgba(255,200,120,.04),rgba(0,0,0,.18));box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--bd),2px 3px 0 rgba(0,0,0,.4)}
html[data-skin=ledger] .tile:hover{border-color:var(--ac)}
html[data-skin=ledger] input,html[data-skin=ledger] select,html[data-skin=ledger] textarea,html[data-skin=ledger] button{border-radius:2px;border:1px solid var(--bd);background-color:var(--card);font-family:inherit}
html[data-skin=ledger] button:hover{border-color:var(--ac);color:var(--ac)}
html[data-skin=ledger] button.pri{background:var(--ac);color:var(--on);border-color:var(--ac);letter-spacing:.04em}html[data-skin=ledger] button.pri:hover{color:var(--on);filter:brightness(1.12)}
html[data-skin=ledger] table{border-top:2px solid var(--bd)}
html[data-skin=ledger] th{font-variant:small-caps;letter-spacing:.07em;font-size:.82rem;color:var(--ac);border-bottom:2px solid var(--bd)}
html[data-skin=ledger] td{border-bottom:1px dotted var(--bd)}
html[data-skin=ledger] tr.grp td{background:transparent;border-bottom:1px solid var(--bd);font-variant:small-caps;text-transform:none;letter-spacing:.08em;font-size:.9rem}
html[data-skin=ledger] tr.tot td{border-top:3px double var(--bd)}
html[data-skin=ledger] nav.site{border-bottom:3px double var(--bd);margin-bottom:8px}
html[data-skin=ledger] nav.site a{border-radius:0;font-variant:small-caps;letter-spacing:.06em;font-size:1.02em}
html[data-skin=ledger] nav.site a:hover{border-color:var(--bd)}
html[data-skin=ledger] nav.site .brand{font-size:1.2em;font-weight:bold}
html[data-skin=ledger] footer.site{border-top:3px double var(--bd);margin-top:10px;padding-top:12px;font-style:italic}
html[data-skin=ledger] details>summary{font-variant:small-caps;letter-spacing:.05em}
html[data-skin=ledger] a{text-decoration-thickness:1px;text-underline-offset:2px}
</style>
