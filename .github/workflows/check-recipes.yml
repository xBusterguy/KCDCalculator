name: Check recipes

# Runs the recipe checker whenever recipe data or the checker itself changes,
# so a typo in assets/recipes.js is caught before it reaches the site.
on:
  push:
    branches: [main]
    paths: ["assets/recipes.js", "scripts/check-recipes.js"]
  pull_request:
    paths: ["assets/recipes.js", "scripts/check-recipes.js"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-recipes.js
