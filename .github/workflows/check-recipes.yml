name: Check recipes and site

# Runs the recipe checker and the site checker whenever the pages, data or checkers change,
# so a typo in assets/recipes.js or a file missing from the offline list is caught before it reaches the site.
on:
  push:
    branches: [main]
    paths: ["assets/**", "scripts/**", "*.html", "sw.js", "changelog.json"]
  pull_request:
    paths: ["assets/**", "scripts/**", "*.html", "sw.js", "changelog.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-recipes.js
      - run: node scripts/check-site.js
