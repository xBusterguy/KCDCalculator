name: Bug report
description: Something on the site is broken or looks wrong
title: "Bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options: [Home, Crafting calculator, Farming, Loadouts, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "e.g. iPhone, Safari / Windows, Chrome"
