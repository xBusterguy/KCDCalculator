<title>KCD Crafting Cost Calculator</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--tx:#2a2218;--mut:#7a6c58;--ac:#8a5a1c;--on:#fffdf8;--bd:#dccfb8;--ok:#2f7a3a;--bad:#b03a2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f0b;--card:#1e1913;--tx:#eadfca;--mut:#a39278;--ac:#d9a44f;--on:#120f0b;--bd:#3a3125;--ok:#6fc47c;--bad:#e8786b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f0b;--card:#1e1913;--tx:#eadfca;--mut:#a39278;--ac:#d9a44f;--on:#120f0b;--bd:#3a3125;--ok:#6fc47c;--bad:#e8786b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Georgia,"Times New Roman",serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:1280px;margin:0 auto;padding:0 14px 16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--bd)}
h1{font-size:1.25rem;margin:0 0 8px;color:var(--ac)}h2{font-size:1rem;margin:0 0 6px}h3{font-size:.85rem;margin:10px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
p.s{color:var(--mut);margin:0 0 8px;font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px}
label.f{display:flex;flex-direction:column;font-size:.75rem;color:var(--mut);gap:2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;max-width:100%;box-sizing:border-box}
button{cursor:pointer}button.pri{background:var(--ac);color:var(--on);border:0}
.chips,#tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
#tabs{margin-bottom:6px}.chips{align-items:center;font-size:.8rem}
.tab,.chip{white-space:nowrap;border-radius:999px;padding:5px 12px;flex:none}.chip{padding:2px 9px}
.tab.on,.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}.tab small{opacity:.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:12px}
@media (min-width:900px){.layout{grid-template-columns:300px minmax(0,1fr);align-items:start}aside{position:sticky;top:calc(var(--hh,120px) + env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - var(--hh,120px) - 30px);overflow:auto}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px}
details>summary{cursor:pointer;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd)}td:first-child{white-space:normal}th{font-size:.75rem;color:var(--mut);position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
tr.lh td{background:var(--bg);color:var(--ac);font-weight:bold;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.bd td{color:var(--mut);font-size:.85rem;padding:8px 14px}
.w{color:var(--bad)}.p{color:var(--ok)}
</style></head><body><main>
<header class="top" id="top"><h1>Crafting Cost Calculator</h1>
<div class="bar">
<label class="f">Markup %<input id="mk" type="number" min="0" step="1" style="width:80px"></label>
<label class="f" style="flex:1;min-width:150px">Search all crafts<input id="q" type="search" placeholder="e.g. cuirass"></label>
<label class="f" style="flex-direction:row;align-items:center;gap:6px;padding-bottom:6px"><input id="hp" type="checkbox"> Fully priced only</label>
<button id="reset">Clear prices</button></div>
<div id="tabs"></div><div class="chips" id="lvs"></div></header>
<div class="layout">
<aside class="card"><details id="matd" open><summary>Material prices (gr.)</summary><p class="s" style="margin-top:6px" id="matnote"></p><div id="matbody"></div></details></aside>
<section><div class="card wrap"><table><thead id="th"></thead><tbody id="rows"></tbody></table>
<p class="s" id="note" style="margin:8px 0 0"></p></div>
<div class="card"><details><summary>Add a custom recipe</summary>
<div class="bar" style="margin-top:8px">
<label class="f">Name<input id="cn"></label><label class="f">Craft<input id="cc" value="Custom"></label>
<label class="f">Yield<input id="cy" type="number" value="1" min="1" style="width:70px"></label>
<label class="f">Bench fee (gr.)<input id="cf" type="number" value="0" min="0" style="width:90px"></label>
<label class="f" style="flex:1;min-width:220px">Ingredients (e.g. steel 5, coal 9, 2 logs)<textarea id="ci" rows="2"></textarea></label>
<button class="pri" id="add">Add</button></div><p class="s" id="msg" style="margin:6px 0 0"></p></details></div></section></div>

const RX=/\{(\w+)\}(\d+)|([A-Za-z])(\d+)/g;let K=0;
const items=DATA.split("\n").flatMap(l=>{const [c,lv,ns,y,i,f]=l.split("|"),r={};i.replace(RX,(m,w,a,k,b)=>r[w||k]=+(a||b));return ns.split(";").map(n=>({k:K++,c:CR[c],l:+lv,n,y:+y,f:+f,r}))});
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let P={},custom=[],S={tab:"Smithing",lv:0,mk:25,q:"",hp:false},open=new Set(),C={};
try{P=JSON.parse(localStorage.getItem("kcd-p")||"{}");custom=JSON.parse(localStorage.getItem("kcd-c")||"[]");const st=JSON.parse(localStorage.getItem("kcd-s")||"{}");if(st.mk!=null)S.mk=st.mk;if(st.tab)S.tab=st.tab}catch(e){}
custom.forEach(c=>c.k=K++);
const save=()=>{try{localStorage.setItem("kcd-p",JSON.stringify(P));localStorage.setItem("kcd-c",JSON.stringify(custom));localStorage.setItem("kcd-s",JSON.stringify({mk:S.mk,tab:S.tab}))}catch(e){}};
const all=()=>items.concat(custom);
const name=id=>RAW[id]||(INT[id]&&INT[id][0])||id;
const ov=id=>P[id]!==undefined&&P[id]!=="";
const sum=r=>{let a=0;for(const k in r)a+=r[k]*unit(k);return a};
const derived=id=>{const [,y,r,f]=INT[id];return(sum(r)+f)/y};
const unit=id=>id in C?C[id]:(C[id]=ov(id)?(+P[id]||0):INT[id]?derived(id):0);
function missing(r,s=new Set()){for(const k in r){if(ov(k))continue;if(INT[k])missing(INT[k][2],s);else if(!(+P[k]>0))s.add(name(k))}return s}
const f1=n=>(Math.round(n*10)/10).toLocaleString("en-GB");
const base=()=>{const q=S.q.toLowerCase();return all().filter(i=>q?i.n.toLowerCase().includes(q):i.c==S.tab)};
function vis(){let L=base();if(S.lv)L=L.filter(i=>i.l==S.lv);if(S.hp)L=L.filter(i=>!missing(i.r).size);return S.q?L:L.sort((a,b)=>a.l-b.l)}

function tabs(){const all_=all();$("tabs").innerHTML=[...new Set(all_.map(i=>i.c))].map(c=>`<button class="tab${c==S.tab&&!S.q?" on":""}" data-c="${esc(c)}">${esc(c)} <small>${all_.filter(i=>i.c==c).length}</small></button>`).join("")}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.c;S.q="";$("q").value="";save();render()};

function mats(){
  const u=new Set(),walk=r=>{for(const k in r)if(!u.has(k)){u.add(k);if(INT[k])walk(INT[k][2])}};base().forEach(i=>walk(i.r));
  const fld=k=>`<label class="f">${esc(name(k))}<input type="number" min="0" step="0.1" data-id="${k}" value="${ov(k)?esc(P[k]):""}"></label>`;
  const rk=Object.keys(RAW).filter(k=>u.has(k)),ik=Object.keys(INT).filter(k=>u.has(k));
  $("matnote").textContent=S.q?"Materials for the search results.":"Materials needed for "+S.tab+".";
  $("matbody").innerHTML=`<h3>Raw materials</h3><div class="grid">${rk.map(fld).join("")}</div>`+(ik.length?`<h3>Intermediate parts</h3><p class="s">Leave blank to work it out from raw prices, or enter a price if you buy the part.</p><div class="grid">${ik.map(fld).join("")}</div>`:"");
  $("matbody").querySelectorAll("input").forEach(e=>e.oninput=()=>{P[e.dataset.id]=e.value;save();upd()});ph()}
const ph=()=>$("matbody").querySelectorAll("input").forEach(e=>{if(INT[e.dataset.id])e.placeholder="≈ "+f1(derived(e.dataset.id))});
let t;const upd=()=>{clearTimeout(t);t=setTimeout(()=>{C={};ph();rows()},120)};

function rows(){
  const m=+S.mk||0,L=vis(),cols=S.q?7:6;let h="",last=-1;
  $("th").innerHTML=`<tr><th>Piece</th>${S.q?"<th>Craft</th>":""}<th>Lv</th><th class="n">Bench fee</th><th class="n">Total cost</th><th class="n">Sell at</th><th class="n">Profit</th></tr>`;
  for(const it of L){
    if(!S.q&&it.l!==last){h+=`<tr class="lh"><td colspan="${cols}">${it.l?"Level "+it.l:"Custom"}</td></tr>`;last=it.l}
    const batch=sum(it.r)+it.f,cost=batch/it.y,sell=Math.ceil(cost*(1+m/100)),ms=[...missing(it.r)];
    h+=`<tr class="r" data-k="${it.k}"><td>${esc(it.n)}${it.y>1?" (×"+it.y+")":""}${ms.length?` <span class="w" title="Unpriced: ${esc(ms.join(", "))}">⚠</span>`:""}</td>${S.q?`<td>${esc(it.c)}</td>`:""}<td>${it.l||""}</td><td class="n">${it.f?f1(it.f/it.y):"–"}</td><td class="n">${f1(cost)}</td><td class="n"><b>${sell}</b></td><td class="n p">+${f1(sell-cost)}</td></tr>`;
    if(open.has(it.k)){
      const D=Object.entries(it.r).map(([k,q])=>`${q} × ${esc(name(k))} @ ${f1(unit(k))} = ${f1(q*unit(k))}`);
      if(it.f)D.push(`Bench fee: ${it.f}`);
      h+=`<tr class="bd"><td colspan="${cols+1}">${D.join("<br>")}<br><b>Batch total: ${f1(batch)}</b>${it.y>1?` ÷ ${it.y} pieces`:""}${ms.length?`<br><span class="w">Unpriced: ${esc(ms.join(", "))}</span>`:""}</td></tr>`}
  }
  $("rows").innerHTML=h||`<tr><td colspan="${cols+1}">No pieces match.</td></tr>`;
  $("note").textContent=L.length+" pieces. Click a row for the breakdown. Total cost = materials + bench fee (divided by yield for batches). Sell price is rounded up to a whole groschen; cosmetic variants with the same recipe are merged.";
}
$("rows").onclick=e=>{const r=e.target.closest("tr.r");if(!r)return;const k=+r.dataset.k;open.has(k)?open.delete(k):open.add(k);rows()};

$("add").onclick=()=>{
  const lookup={};for(const k in RAW)lookup[RAW[k].toLowerCase()]=k;for(const k in INT)lookup[INT[k][0].toLowerCase()]=k;
  const r={},bad=[];
  $("ci").value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    const a=p.match(/^(\d+(?:\.\d+)?)\s*[x×]?\s*(.+)$/),b=p.match(/^(.+?)\s*[:x×]?\s*(\d+(?:\.\d+)?)$/);
    const [q,n]=a?[+a[1],a[2]]:b?[+b[2],b[1]]:[0,p];const id=lookup[n.toLowerCase().trim()];
    if(id&&q)r[id]=(r[id]||0)+q;else bad.push(p)});
  const nm=$("cn").value.trim();
  if(!nm||!Object.keys(r).length||bad.length){$("msg").textContent=bad.length?"Not recognised: "+bad.join("; ")+". Use the material names shown in the price panel.":"Give the piece a name and at least one ingredient.";return}
  const c=$("cc").value.trim()||"Custom";custom.push({k:K++,c,l:0,n:nm,y:Math.max(1,+$("cy").value||1),f:+$("cf").value||0,r});
  S.tab=c;S.q="";$("q").value="";save();$("msg").textContent=`Added “${nm}” under ${c}.`;render()};
if(!all().some(i=>i.c==S.tab))S.tab="Smithing";
